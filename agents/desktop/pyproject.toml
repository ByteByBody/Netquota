[project]
name = "netquota-agent"
version = "0.1.0"
description = "NetQuota desktop agent (Windows/Linux)"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
secure = ["keyring>=24.0"]
dev = ["pytest>=7.4"]

[project.scripts]
netquota-agent = "netquota_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netquota_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"